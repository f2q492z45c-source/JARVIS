<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JARVIS">
<meta name="theme-color" content="#0b1020"><title>JARVIS</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e8ecf5;font:16px -apple-system,sans-serif;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #1f2a4a}
h1{margin:0;font-size:18px;letter-spacing:3px;color:#5ee0ff}button,select,input{font:inherit;color:inherit}
button{background:#1a2650;border:0;border-radius:10px;padding:10px 14px}button.p{background:#2a6cff}
#log{flex:1;overflow-y:auto;padding:12px}.m{margin:8px 0;padding:10px 12px;border-radius:14px;max-width:88%;white-space:pre-wrap;word-wrap:break-word}
.moi{background:#2a6cff;margin-left:auto}.jarvis{background:#1a2650}.err{background:#5a1f2b}.act{background:#2b2a14;border:1px solid #6b6a2a}.load{background:#141c3a;opacity:.7;font-style:italic}
.m small{display:block;opacity:.5;margin-top:4px}.m button{margin:8px 6px 0 0}
footer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #1f2a4a}footer input{flex:1;background:#141c3a;border:0;border-radius:12px;padding:12px}
#set{display:none;position:fixed;inset:0;background:#0b1020;overflow:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 40px;z-index:5}
#set label{display:block;margin:10px 0;font-size:13px;opacity:.9}#set input,#set select{display:block;width:100%;margin-top:4px;background:#141c3a;border:0;border-radius:10px;padding:10px}
pre{background:#141c3a;padding:10px;border-radius:10px;overflow:auto;font-size:12px}
</style></head><body>
<header><h1>JARVIS</h1><span><button id="mute">🔊</button> <button id="gear">⚙︎</button></span></header>
<div id="log"></div>
<footer><button id="mic">🎤</button><input id="in" placeholder="Parle ou écris…" enterkeyhint="send"><button class="p" id="go">➤</button></footer>
<div id="set"></div>
<script>
const $=s=>document.querySelector(s);
const CFG={
groq:{url:"https://api.groq.com/openai/v1",model:"llama-3.3-70b-versatile",lim:1e5,rpm:25},
cerebras:{url:"https://api.cerebras.ai/v1",model:"llama-3.3-70b",lim:9e5,rpm:25},
gemini:{url:"https://generativelanguage.googleapis.com/v1beta/openai",model:"gemini-2.5-flash",lim:25e4,rpm:8},
mistral:{url:"https://api.mistral.ai/v1",model:"mistral-small-latest",lim:3e5,rpm:1},
openrouter:{url:"https://openrouter.ai/api/v1",model:"meta-llama/llama-3.3-70b-instruct:free",lim:15e4,rpm:15}
};
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let keys=ls.get("keys",{}),strategy=ls.get("strat","priority"),muted=ls.get("mute",false);
const day=()=>new Date().toISOString().slice(0,10);
function S(){let s=ls.get("st",{});if(s.day!==day())s={day:day(),use:{},cool:{},calls:{}};return s}
const frac=(n,s)=>((s.use[n]||{tok:0}).tok)/CFG[n].lim;
function eligible(n,s){const c=CFG[n];if(!keys[n]) return false;if((s.cool[n]||0)>Date.now() || frac(n,s)>=.95) return false;return (s.calls[n]||[]).filter(t=>t>Date.now()-6e4).length < c.rpm}
function order(s){const l=Object.keys(CFG).filter(n=>eligible(n,s));if(strategy==="balanced") l.sort((a,b)=>frac(a,s)-frac(b,s));return l}
async function llm(msgs){
    const s=S(),errs=[];
    for(const n of order(s)){
        try{
            const c=CFG[n];const controller = new AbortController();const timeoutId = setTimeout(() => controller.abort(), 15000);
            const r=await fetch(c.url+"/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+keys[n]},body:JSON.stringify({model:c.model,messages:msgs,max_tokens:800}),signal:controller.signal});
            clearTimeout(timeoutId);
            if(r.status===429){s.cool[n]=Date.now()+(+r.headers.get("retry-after")||300)*1e3;errs.push(n+": quota");continue;}
            if(!r.ok) throw new Error("HTTP "+r.status);
            const d=await r.json(),t=d.choices[0].message.content||"";
            const tok=d.usage?.total_tokens||Math.ceil((JSON.stringify(msgs).length+t.length)/4);
            const u=s.use[n]||{tok:0,req:0};u.tok+=tok;u.req++;s.use[n]=u;(s.calls[n]=s.calls[n]||[]).push(Date.now());ls.set("st",s);return [t,n];
        }catch(e){s.cool[n]=Date.now()+6e4;errs.push(n+": "+(e.name==="AbortError"?"Timeout":e.message));}
    }
    ls.set("st",s);throw new Error("Aucun fournisseur disponible. "+(errs.join("; ")||"Ajoutez une clé dans ⚙︎."));
}
let speechUnlocked = false;
document.addEventListener('click', () => {if (!speechUnlocked && 'speechSynthesis' in window) {const u = new SpeechSynthesisUtterance('');speechSynthesis.speak(u);speechUnlocked = true;}}, { once: true });
let voice=null;const PREF=["Audrey","Aurélie","Amélie","Marie","Julie","Hortense"];
const frVoices=()=>speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith("fr"));
function pickVoice(){const v=frVoices(),sel=ls.get("voice",null);voice=v.find(x=>x.name===sel)||PREF.map(p=>v.find(x=>x.name.includes(p))).find(Boolean)||v[0]||null}
if("speechSynthesis"in window){speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}
function speak(t){if(muted||!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang="fr-FR";u.rate=1.02;u.pitch=1.05;speechSynthesis.speak(u)}
let gtok=null;const GH=()=>({Authorization:"Bearer "+gtok});
function gconnect(){if(!keys.gclient)return alert("Renseigne le Client ID Google d'abord.");
google.accounts.oauth2.initTokenClient({client_id:keys.gclient,scope:"https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.compose",
callback:r=>{if(r.access_token){gtok=r.access_token;add("jarvis","Gmail connecté (1 h).")}else add("err","Connexion Gmail refusée")}}).requestAccessToken()}
async function gmailList(){if(!gtok)throw new Error("Gmail non connecté");
const b="https://gmail.googleapis.com/gmail/v1/users/me/messages";
const l=await(await fetch(b+"?q=is:unread&maxResults=10",{headers:GH()})).json();if(l.error)throw new Error(l.error.message);
if(!l.messages)return "Aucun mail non lu.";
const out=[];for(const m of l.messages){const d=await(await fetch(`${b}/${m.id}?format=metadata&metadataHeaders=From&metadataHeaders=Subject`,{headers:GH()})).json();
const h=n=>(d.payload.headers.find(x=>x.name===n)||{}).value||"";out.push(`- ${h("From")} | ${h("Subject")} | ${d.snippet}`)}return out.join("\n")}
const b64=s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
async function gmailDraft(a){if(!gtok)throw new Error("Gmail non connecté");
const raw=b64(`To: ${a.to}\r\nSubject: =?UTF-8?B?${b64(a.subject||"")}?=\r\nMIME-Version: 1.0\r\nContent-Type: text/plain; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n${b64(a.body||"")}`).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const r=await fetch("https://gmail.googleapis.com/gmail/v1/users/me/drafts",{method:"POST",headers:{...GH(),"Content-Type":"application/json"},body:JSON.stringify({message:{raw}})});
if(!r.ok)throw new Error("HTTP "+r.status)}
const SYS=`Tu es JARVIS, assistante personnelle. Tu réponds en français, très brièvement (tes réponses sont lues à voix haute). Date : ${new Date().toLocaleString("fr-FR")}.
Outils : réponds EXCLUSIVEMENT par un bloc de code JSON entouré de \`\`\`json et \`\`\`, rien d'autre.
{"tool":"mails_lire"} : lit les 10 derniers mails non lus
{"tool":"mail_brouillon","args":{"to":"","subject":"","body":""}} : crée un brouillon
{"tool":"agenda","args":{"action":"lire"|"creer","titre":"","debut":"AAAA-MM-JJ HH:MM","fin":"AAAA-MM-JJ HH:MM"}}
Pour répondre à l'utilisateur : {"final":"..."}. N'invente jamais un mail ni un rendez-vous.`;
const hist=[{role:"system",content:SYS}];
function add(c,t,p){const d=document.createElement("div");d.className="m "+c;d.textContent=t;if(p){const s=document.createElement("small");s.textContent="via "+p;d.append(s)}$("#log").append(d);$("#log").scrollTop=1e9;return d}
function confirmAction(j){const a=j.args||{};const d=add("act",j.tool==="agenda"?`Agenda (${a.action}) : ${a.titre||""} ${a.debut||""}`:`Brouillon pour ${a.to} — ${a.subject}\n${a.body}`);
const ok=document.createElement("button");ok.className="p";ok.textContent="Valider";const no=document.createElement("button");no.textContent="Annuler";d.append(ok,no);
no.onclick=()=>d.remove();
ok.onclick=async()=>{if(j.tool==="agenda"){location.href="shortcuts://x-callback-url/run-shortcut?name="+encodeURIComponent("JARVIS Agenda")+"&input=text&text="+encodeURIComponent(JSON.stringify(a))+"&x-success="+encodeURIComponent(location.origin+location.pathname)}
else{try{await gmailDraft(a);d.remove();add("jarvis","Brouillon créé dans Gmail.");speak("Brouillon créé.")}catch(e){add("err",e.message)}}}}
async function ask(text){
    add("moi",text);hist.push({role:"user",content:text});const loader = add("load", "JARVIS réfléchit...");
    for(let i=0;i<5;i++){let t,n;try{[t,n]=await llm(hist)}catch(e){loader.remove();add("err",e.message);return}
        loader.remove();let j;try {const match = t.match(/```json\n([\s\S]*?)\n```/) || t.match(/\{[\s\S]*\}/);j = JSON.parse(match[1] || match[0]);} catch { j = { final: t.replace(/```json|```/g, '').trim() }; }
        hist.push({role:"assistant",content:t});if(j.final){add("jarvis",j.final,n);speak(j.final);return}
        if(j.tool==="mails_lire"){const loader2 = add("load", "Lecture des mails...");let r;try{r=await gmailList()}catch(e){r="ERREUR : "+e.message}loader2.remove();hist.push({role:"user",content:"Résultat mails_lire :\n"+r});continue;}
        if(j.tool==="mail_brouillon"||j.tool==="agenda"){confirmAction(j);return}hist.push({role:"user",content:"Outil inconnu."});}
    add("err","Trop d'étapes sans réponse.");}
const send=()=>{const v=$("#in").value.trim();if(v){$("#in").value="";ask(v)}};
$("#go").onclick=send;$("#in").onkeydown=e=>{if(e.key==="Enter")send()};
$("#mute").textContent=muted?"🔇":"🔊";$("#mute").onclick=()=>{muted=!muted;ls.set("mute",muted);$("#mute").textContent=muted?"🔇":"🔊";speechSynthesis.cancel()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){$("#mic").onclick=()=>{const r=new SR();r.lang="fr-FR";r.onresult=e=>ask(e.results[0][0].transcript);r.onerror=()=>add("err","Micro indisponible : utilise le micro du clavier iOS.");r.start()}}
else{$("#mic").onclick=()=>$("#in").focus();$("#in").placeholder="Écris ou dicte avec le micro du clavier"}
function renderSet(){
    const p=$("#set"),s=S();
    const keysHtml = Object.keys(CFG).map(n => `<label>${n}<input type="password" class="key-input" data-k="${n}" value="${keys[n] || ""}"></label>`).join("");
    p.innerHTML = `<h3>Clés API (Gratuit)</h3>${keysHtml}
    <label>Google Client ID (Gmail)<input id="gclientInp" value="${keys.gclient || ""}"></label><button id="gc">Connecter Gmail</button>
    <label>Stratégie<select id="strat"><option>priority<option>balanced</select></label><label>Voix (fr)<select id="vsel"></select></label>
    <h3>Quotas du jour (Tokens)</h3><pre>${Object.keys(CFG).map(n => n.padEnd(11) + ((s.use[n] || {tok:0}).tok + "/" + CFG[n].lim).padEnd(16) + (!keys[n] ? "pas de clé" : (s.cool[n] || 0) > Date.now() ? "pause" : frac(n, s) >= .95 ? "épuisé" : "OK")).join("\n")}</pre><button class="p" id="close">Fermer</button>`;
    p.querySelectorAll('.key-input').forEach(input => {
        input.addEventListener('input', (e) => {
            keys[e.target.dataset.k] = e.target.value.trim();
            ls.set("keys", keys);
            const quotasPre = p.querySelector('pre');
            quotasPre.innerHTML = Object.keys(CFG).map(n => n.padEnd(11) + ((s.use[n] || {tok:0}).tok + "/" + CFG[n].lim).padEnd(16) + (!keys[n] ? "pas de clé" : (s.cool[n] || 0) > Date.now() ? "pause" : frac(n, s) >= .95 ? "épuisé" : "OK")).join("\n");
        });
    });
    $("#gclientInp").onchange = (e) => { keys.gclient = e.target.value.trim(); ls.set("keys", keys); };
    $("#gc").onclick=gconnect;$("#strat").value=strategy;$("#strat").onchange=e=>{strategy=e.target.value;ls.set("strat",strategy)};
    const vs=$("#vsel");frVoices().forEach(v=>vs.add(new Option(v.name+" ("+v.lang+")",v.name)));if(voice)vs.value=voice.name;
    vs.onchange=()=>{ls.set("voice",vs.value);pickVoice();speak("Bonjour, je suis JARVIS.")};$("#close").onclick=()=>p.style.display="none";
}
$("#gear").onclick=()=>{renderSet();$("#set").style.display="block"};
const q=new URLSearchParams(location.search);
if(q.get("result")){history.replaceState(null,"",location.pathname);add("jarvis","Agenda : "+q.get("result"))}
else add("jarvis","Bonjour. Ouvre ⚙︎ pour ajouter tes clés gratuites.");
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
